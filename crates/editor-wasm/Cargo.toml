[package]
name = "editor-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
editor-core = { path = "../editor-core" }
makefigma-document-codec = { path = "../document-codec" }
makefigma-graphics-core = { path = "../graphics-core" }
makefigma-renderer-wgpu = { path = "../renderer-wgpu" }
wasm-bindgen = "0.2.108"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
font-test-data = "0.8"
makefigma-protocol = { path = "../protocol" }
prost = "0.13.5"
