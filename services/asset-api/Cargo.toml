[package]
name = "makefigma-asset-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8"
makefigma-asset-service = { path = "../../crates/asset-service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
tower = "0.5"
