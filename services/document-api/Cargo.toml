editor-core = { path = "../../crates/editor-core" }
prost = "0.13.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
tower = "0.5"
