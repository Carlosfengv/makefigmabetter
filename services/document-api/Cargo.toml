[package]
name = "makefigma-document-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8"
makefigma-document-service = { path = "../../crates/document-service" }
makefigma-document-codec = { path = "../../crates/document-codec" }
