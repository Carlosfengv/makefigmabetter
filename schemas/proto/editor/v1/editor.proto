syntax = "proto3";

package makefigma.editor.v1;

// Field numbers in this file are append-only. Removed fields must be reserved;
// durable operations and snapshots are never represented by in-memory Rust types.

message VersionRange {
  uint32 min_protocol_version = 1;
  uint32 max_protocol_version = 2;
}

message PositionId {
  bytes key = 1;       // exactly 16 big-endian bytes
  bytes actor_id = 2;  // exactly 16 big-endian bytes
}

message PageRef {
  bytes page_id = 1;       // exactly 16 bytes
  string name = 2;
  PositionId position_id = 3;
}

message SceneNodeRef {
  bytes node_id = 1;       // exactly 16 bytes
  optional bytes parent_id = 2;
  bytes page_id = 3;       // exactly 16 bytes
  PositionId position_id = 4;
  bytes canonical_node = 5; // versioned canonical node payload, owned by editor-core
}

message PageChunk {
  uint32 format_version = 1;
  PageRef page = 2;
  repeated SceneNodeRef nodes = 3;
  bytes content_hash = 4; // SHA-256 over canonical page state, not protobuf bytes
  map<string, bytes> extensions = 5;
}

message ResourceIndexEntry {
  bytes asset_id = 1;
  bytes content_hash = 2;
  string media_type = 3;
  optional uint64 byte_length = 4;
  optional uint32 pixel_width = 5;
  optional uint32 pixel_height = 6;
  // Immutable OpenType name-table projection for every admitted face. The
  // browser uses these names only as Figma-compatible public identities; font
  // bytes remain content addressed by asset_id/content_hash.
  repeated FontFaceMetadata font_faces = 7;
}

message FontFaceMetadata {
  uint32 face_index = 1;
  string family = 2;
  string style = 3;
  // Bounded localized family/style identities from the same immutable face.
  // The preferred identity above remains the stable default projection.
  repeated FontNameAlias aliases = 4;
}

message FontNameAlias {
  string family = 1;
  string style = 2;
}

message DocumentSnapshot {
  uint32 format_version = 1;
  uint32 engine_semantics_version = 2;
  bytes document_id = 3;
  uint64 revision = 4;
  bytes content_hash = 5; // SHA-256 over canonical document state
  repeated PageChunk page_chunks = 6;
  repeated ResourceIndexEntry resource_index = 7;
  map<string, bytes> extensions = 8;
  reserved 9 to 15;
  DocumentColorProfile document_color_profile = 16;
  repeated bytes retired_node_ids = 17;
  // Complete document-owned TextStyle values. IDs intentionally remain
  // strings because Figma style identities are not UUIDs.
  repeated TextStyleResource text_styles = 18;
  // Complete document-owned PaintStyle values.
  repeated PaintStyleResource paint_styles = 19;
  // Immutable variable catalogs. Collection modes and variable values are
  // persisted together so aliases can be resolved without a UI-side cache.
  repeated VariableCollectionResource variable_collections = 20;
  repeated VariableResource variables = 21;
}

enum NodeKind {
  NODE_KIND_UNSPECIFIED = 0;
  NODE_KIND_FRAME = 1;
  NODE_KIND_RECTANGLE = 2;
  NODE_KIND_ELLIPSE = 3;
  NODE_KIND_TEXT = 4;
  NODE_KIND_IMAGE = 5;
  NODE_KIND_LINE = 6;
  // Structural container. Its bounds are derived by Group commands and it
  // never paints a rectangle of its own.
  NODE_KIND_GROUP = 7;
  // Canvas organization container. Unlike Frame, hiding its contents does not
  // change the Section's own visibility or geometry.
  NODE_KIND_SECTION = 8;
  // Generated closed outline whose durable source is a point count.
  NODE_KIND_POLYGON = 9;
  // Generated concave outline whose durable source includes an inner ratio.
  NODE_KIND_STAR = 10;
  NODE_KIND_VECTOR = 11;
  NODE_KIND_BOOLEAN_OPERATION = 12;
  // Non-painting canonical export region (Phase 2 G5).
  NODE_KIND_SLICE = 13;
  // FigJam code block. Its source is stored in SceneNode.text; the language
  // remains a forward-compatible Canonical extension.
  NODE_KIND_CODE_BLOCK = 14;
  // Design component. Component-specific metadata is forward-compatible
  // extension data while child hierarchy uses the Canonical tree.
  NODE_KIND_COMPONENT = 15;
  NODE_KIND_INSTANCE = 16;
  NODE_KIND_SLOT = 17;
  NODE_KIND_COMPONENT_SET = 18;
  NODE_KIND_CONNECTOR = 19;
  NODE_KIND_EMBED = 20;
  NODE_KIND_HIGHLIGHT = 21;
  NODE_KIND_INTERACTIVE_SLIDE_ELEMENT = 22;
  NODE_KIND_LINK_UNFURL = 23;
  NODE_KIND_MEDIA = 24;
  NODE_KIND_SHAPE_WITH_TEXT = 25;
  // Read-only root container in Figma Slides. Its children are Slide Rows.
  NODE_KIND_SLIDE_GRID = 26;
  NODE_KIND_SLIDE = 27;
  NODE_KIND_SLIDE_ROW = 28;
  NODE_KIND_STAMP = 29;
  NODE_KIND_STICKY = 30;
  NODE_KIND_TABLE = 31;
  NODE_KIND_TABLE_CELL = 32;
  NODE_KIND_TEXT_PATH = 33;
  NODE_KIND_TRANSFORM_GROUP = 34;
  NODE_KIND_WASHI_TAPE = 35;
  NODE_KIND_WIDGET = 36;
}

// Open-path endpoint decoration. Unspecified is accepted from historical
// payloads and deterministically migrates to NONE at the Core boundary.
enum StrokeCap {
  STROKE_CAP_UNSPECIFIED = 0;
  STROKE_CAP_NONE = 1;
  STROKE_CAP_ROUND = 2;
  STROKE_CAP_SQUARE = 3;
  STROKE_CAP_ARROW_LINES = 4;
  STROKE_CAP_ARROW_EQUILATERAL = 5;
  STROKE_CAP_DIAMOND_FILLED = 6;
  STROKE_CAP_TRIANGLE_FILLED = 7;
  STROKE_CAP_CIRCLE_FILLED = 8;
}

enum StrokeJoin {
  STROKE_JOIN_UNSPECIFIED = 0;
  STROKE_JOIN_MITER = 1;
  STROKE_JOIN_BEVEL = 2;
  STROKE_JOIN_ROUND = 3;
}

enum StrokeAlign {
  STROKE_ALIGN_UNSPECIFIED = 0;
  STROKE_ALIGN_CENTER = 1;
  STROKE_ALIGN_INSIDE = 2;
  STROKE_ALIGN_OUTSIDE = 3;
}

// CSS/Canvas-interoperable Figma blend subset. Zero preserves the historical
// source-over result for snapshots and operation payloads authored before
// Blend Mode existed. New values are append-only.
enum BlendMode {
  BLEND_MODE_NORMAL = 0;
  BLEND_MODE_MULTIPLY = 1;
  BLEND_MODE_SCREEN = 2;
  BLEND_MODE_OVERLAY = 3;
  BLEND_MODE_DARKEN = 4;
  BLEND_MODE_LIGHTEN = 5;
  BLEND_MODE_COLOR_DODGE = 6;
  BLEND_MODE_COLOR_BURN = 7;
  BLEND_MODE_HARD_LIGHT = 8;
  BLEND_MODE_SOFT_LIGHT = 9;
  BLEND_MODE_DIFFERENCE = 10;
  BLEND_MODE_EXCLUSION = 11;
  BLEND_MODE_HUE = 12;
  BLEND_MODE_SATURATION = 13;
  BLEND_MODE_COLOR = 14;
  BLEND_MODE_LUMINOSITY = 15;
  // Node-only container mode. PaintLayer validation rejects this value.
  BLEND_MODE_PASS_THROUGH = 16;
  // Canvas nodes and Paint Stack layers use explicit bounded pixel compositing.
  BLEND_MODE_LINEAR_BURN = 17;
  BLEND_MODE_LINEAR_DODGE = 18;
}

// Figma's per-axis behavior when the containing Frame is resized. Unspecified
// remains a legacy absence at the Canonical boundary rather than silently
// becoming an effective constraint.
enum ConstraintType {
  CONSTRAINT_TYPE_UNSPECIFIED = 0;
  CONSTRAINT_TYPE_MIN = 1;
  CONSTRAINT_TYPE_CENTER = 2;
  CONSTRAINT_TYPE_MAX = 3;
  CONSTRAINT_TYPE_STRETCH = 4;
  CONSTRAINT_TYPE_SCALE = 5;
}

message Constraints {
  ConstraintType horizontal = 1;
  ConstraintType vertical = 2;
}

// Auto Layout is explicit canonical input. Omission is the legacy fixed-size,
// non-layout default; it must never be inferred from a node's current bounds.
enum LayoutMode {
  LAYOUT_MODE_UNSPECIFIED = 0;
  LAYOUT_MODE_NONE = 1;
  LAYOUT_MODE_HORIZONTAL = 2;
  LAYOUT_MODE_VERTICAL = 3;
}

enum LayoutAlignment {
  LAYOUT_ALIGNMENT_UNSPECIFIED = 0;
  LAYOUT_ALIGNMENT_START = 1;
  LAYOUT_ALIGNMENT_CENTER = 2;
  LAYOUT_ALIGNMENT_END = 3;
  LAYOUT_ALIGNMENT_SPACE_BETWEEN = 4;
  // Counter-axis only on horizontal Auto Layout frames. Never use this for a
  // primary axis or child align_self override.
  LAYOUT_ALIGNMENT_BASELINE = 5;
}

enum LayoutSizing {
  LAYOUT_SIZING_UNSPECIFIED = 0;
  LAYOUT_SIZING_FIXED = 1;
  LAYOUT_SIZING_HUG = 2;
  LAYOUT_SIZING_FILL = 3;
}

// Figma counterAxisAlignContent's Phase 2 wrap-track subset.
enum WrapTrackAlignment {
  WRAP_TRACK_ALIGNMENT_UNSPECIFIED = 0;
  WRAP_TRACK_ALIGNMENT_AUTO = 1;
  WRAP_TRACK_ALIGNMENT_SPACE_BETWEEN = 2;
}

message AutoLayout {
  LayoutMode mode = 1;
  double padding_top = 2;
  double padding_right = 3;
  double padding_bottom = 4;
  double padding_left = 5;
  double item_spacing = 6;
  bool wrap = 7;
  LayoutAlignment primary_alignment = 8;
  LayoutAlignment counter_alignment = 9;
  LayoutSizing primary_sizing = 10;
  LayoutSizing counter_sizing = 11;
  optional double min_width = 12;
  optional double max_width = 13;
  optional double min_height = 14;
  optional double max_height = 15;
  bool absolute = 16;
  // Child-only cross-axis override. Omitted means inherit the Frame's
  // counter_alignment. SpaceBetween and Baseline are rejected by the
  // Canonical validator.
  optional LayoutAlignment align_self = 17;
  // Optional counter-axis gap between wrap tracks. Omitted preserves the
  // historical behavior of reusing item_spacing for backwards-compatible
  // snapshots.
  optional double track_spacing = 18;
  // Figma counterAxisAlignContent. Omission/default is AUTO; SPACE_BETWEEN is
  // valid only when wrap is true.
  optional WrapTrackAlignment wrap_track_alignment = 19;
}

enum ColorSpace {
  COLOR_SPACE_UNSPECIFIED = 0;
  COLOR_SPACE_SRGB = 1;
  COLOR_SPACE_DISPLAY_P3 = 2;
  COLOR_SPACE_LINEAR_SRGB = 3;
}

enum DocumentColorProfile {
  DOCUMENT_COLOR_PROFILE_UNSPECIFIED = 0;
  DOCUMENT_COLOR_PROFILE_SRGB = 1;
  DOCUMENT_COLOR_PROFILE_DISPLAY_P3 = 2;
}

message Color {
  ColorSpace space = 1;
  float red = 2;
  float green = 3;
  float blue = 4;
  float alpha = 5;
}

// R3's single base effect. E1 will migrate this losslessly into an ordered
// Effect Stack; omission means the node has no shadow.
message DropShadow {
  double offset_x = 1;
  double offset_y = 2;
  double blur_radius = 3;
  double spread = 4;
  Color color = 5;
  bool visible = 6;
}

// Blurs the node's isolated source surface before it is composited.  This is
// intentionally separate from Background Blur, which requires a backdrop pass.
message LayerBlur {
  double radius = 1;
  bool visible = 2;
}

// A shadow clipped to the node's isolated source alpha.
message InnerShadow {
  double offset_x = 1;
  double offset_y = 2;
  double blur_radius = 3;
  double spread = 4;
  Color color = 5;
  bool visible = 6;
}

// Blurs already-composited backdrop pixels within the node's source alpha.
message BackgroundBlur {
  double radius = 1;
  bool visible = 2;
}

// Ordered, extensible Effect Stack. The legacy drop_shadow fields remain a
// compatibility projection of the first entry while older clients upgrade.
message Effect {
  oneof kind {
    DropShadow drop_shadow = 1;
    LayerBlur layer_blur = 2;
    InnerShadow inner_shadow = 3;
    BackgroundBlur background_blur = 4;
  }
}

message GradientStop {
  float position = 1;
  Color color = 2;
}

message LinearGradient {
  float start_x = 1;
  float start_y = 2;
  float end_x = 3;
  float end_y = 4;
  repeated GradientStop stops = 5;
}

message ArcData {
  double starting_angle = 1;
  double ending_angle = 2;
  double inner_radius = 3;
}

message PolygonParameters {
  uint32 point_count = 1;
}

message StarParameters {
  uint32 point_count = 1;
  double inner_ratio = 2;
}

enum VectorPointType {
  VECTOR_POINT_TYPE_UNSPECIFIED = 0;
  VECTOR_POINT_TYPE_CORNER = 1;
  VECTOR_POINT_TYPE_MIRRORED = 2;
  VECTOR_POINT_TYPE_ASYMMETRIC = 3;
}

enum FillRule {
  FILL_RULE_UNSPECIFIED = 0;
  FILL_RULE_NON_ZERO = 1;
  FILL_RULE_EVEN_ODD = 2;
}

message VectorPoint {
  bytes point_id = 1;
  double x = 2;
  double y = 3;
  optional double handle_in_x = 4;
  optional double handle_in_y = 5;
  optional double handle_out_x = 6;
  optional double handle_out_y = 7;
  VectorPointType point_type = 8;
}

message VectorSubpath {
  bool closed = 1;
  repeated VectorPoint points = 2;
}

message VectorPath {
  FillRule fill_rule = 1;
  repeated VectorSubpath subpaths = 2;
}

// The durable BooleanOperation selector. Operand children remain ordinary
// SceneNodes beneath the BooleanOperation node (ADR 0028).
enum BooleanOperation {
  BOOLEAN_OPERATION_UNSPECIFIED = 0;
  BOOLEAN_OPERATION_UNION = 1;
  BOOLEAN_OPERATION_INTERSECT = 2;
  BOOLEAN_OPERATION_SUBTRACT = 3;
  BOOLEAN_OPERATION_EXCLUDE = 4;
}

message Transform {
  double a = 1;
  double b = 2;
  double c = 3;
  double d = 4;
  double e = 5;
  double f = 6;
}

message Paint {
  oneof kind {
    Color solid = 1;
    LinearGradient linear_gradient = 2;
  }
}

enum ImageScaleMode {
  IMAGE_SCALE_MODE_UNSPECIFIED = 0;
  IMAGE_SCALE_MODE_FILL = 1;
  IMAGE_SCALE_MODE_FIT = 2;
  IMAGE_SCALE_MODE_CROP = 3;
  IMAGE_SCALE_MODE_TILE = 4;
}

message ImagePaint {
  bytes asset_id = 1;
  ImageScaleMode scale_mode = 2;
  Transform transform = 3;
  // Figma ImagePaint rotation applies only to Fill/Fit/Tile and is
  // canonicalized to 0/90/180/270 degrees.
  sint32 rotation_degrees = 4;
  // Presence-bearing Figma image adjustments. Each present value is in [-1, 1].
  ImageFilters filters = 5;
}

message ImageFilters {
  optional float exposure = 1;
  optional float contrast = 2;
  optional float saturation = 3;
  optional float temperature = 4;
  optional float tint = 5;
  optional float highlights = 6;
  optional float shadows = 7;
}

enum GradientPaintKind {
  GRADIENT_PAINT_KIND_UNSPECIFIED = 0;
  GRADIENT_PAINT_KIND_RADIAL = 1;
  GRADIENT_PAINT_KIND_ANGULAR = 2;
  GRADIENT_PAINT_KIND_DIAMOND = 3;
}

// Non-linear gradients retain Figma's complete local-to-gradient transform.
// This payload belongs to the versioned PaintStack and has no lossy legacy
// Paint mirror.
message GradientPaint {
  GradientPaintKind kind = 1;
  Transform transform = 2;
  repeated GradientStop stops = 3;
}

message PaintLayer {
  oneof kind {
    Color solid = 1;
    LinearGradient linear_gradient = 2;
    ImagePaint image = 3;
    GradientPaint gradient = 7;
  }
  bool visible = 4;
  float opacity = 5;
  BlendMode blend_mode = 6;
}

// Presence is semantic: a present wrapper with zero layers means explicit no
// paint, while an omitted wrapper selects the legacy singular/repeated fields.
message PaintStack {
  repeated PaintLayer layers = 1;
}

message FontVariation {
  string tag = 1; // exactly four ASCII bytes
  float value = 2;
}

message FontReference {
  bytes asset_id = 1;
  uint32 face_index = 2;
  repeated FontVariation variation_axes = 3;
}

enum TextAlignment {
  TEXT_ALIGNMENT_UNSPECIFIED = 0;
  TEXT_ALIGNMENT_LEFT = 1;
  TEXT_ALIGNMENT_CENTER = 2;
  TEXT_ALIGNMENT_RIGHT = 3;
  TEXT_ALIGNMENT_JUSTIFY = 4;
}

enum TextAutoSize {
  TEXT_AUTO_SIZE_UNSPECIFIED = 0;
  TEXT_AUTO_SIZE_FIXED = 1;
  TEXT_AUTO_SIZE_HEIGHT = 2;
  TEXT_AUTO_SIZE_WIDTH_AND_HEIGHT = 3;
}

// Figma TextNode.textTruncation. UNSPECIFIED is legacy wire absence and has
// the same effective behavior as DISABLED without changing old snapshots.
enum TextTruncation {
  TEXT_TRUNCATION_UNSPECIFIED = 0;
  TEXT_TRUNCATION_DISABLED = 1;
  TEXT_TRUNCATION_ENDING = 2;
}

// Figma TextCase. UNSPECIFIED is legacy wire absence and has the same
// effective behavior as ORIGINAL without changing old document hashes.
enum TextCase {
  TEXT_CASE_UNSPECIFIED = 0;
  TEXT_CASE_ORIGINAL = 1;
  TEXT_CASE_UPPER = 2;
  TEXT_CASE_LOWER = 3;
  TEXT_CASE_TITLE = 4;
  TEXT_CASE_SMALL_CAPS = 5;
  TEXT_CASE_SMALL_CAPS_FORCED = 6;
}

message TextStyleRun {
  uint32 start = 1; // UTF-8 byte offset at a scalar boundary
  uint32 end = 2;
  FontReference font = 3;
  double font_size = 4;
  uint32 font_weight = 5;
  bool italic = 6;
  double letter_spacing = 7;
  // Optional per-run color; omission inherits the Text node fill.
  optional Color color = 8;
  // Presence-bearing Figma range fills. A present empty stack means no paint;
  // omission falls back to color and then to the owning Text node fill.
  optional PaintStack fill_stack = 9;
  // Omission is the legacy ORIGINAL behavior. Presence requires engine
  // semantics 16 so older readers cannot silently erase presentation case.
  optional TextCase text_case = 10;
  // Figma range hyperlink metadata. Message presence distinguishes no link.
  HyperlinkTarget hyperlink = 11;
  // Omission is Figma NONE. Presence requires engine semantics 22.
  optional TextDecoration text_decoration = 12;
  // Omission is Figma SOLID. Non-default values require engine semantics 23.
  optional TextDecorationStyle text_decoration_style = 13;
  // Omission is Figma AUTO. Explicit values require engine semantics 24.
  optional TextDecorationOffset text_decoration_offset = 14;
  // Omission is Figma AUTO. Explicit values require engine semantics 25.
  optional TextDecorationThickness text_decoration_thickness = 15;
  optional TextDecorationColor text_decoration_color = 16;
  // Omission preserves the legacy continuous underline. true requires engine
  // semantics 27 and enables Figma's descender-aware skip-ink behavior.
  optional bool text_decoration_skip_ink = 17;
  // Omission is Figma NONE. CAP_HEIGHT requires engine semantics 28 and
  // removes the outer leading above the first line and below the last line.
  optional LeadingTrim leading_trim = 18;
  // Sorted explicit overrides only. Tags use the Figma/API uppercase form;
  // enabled=false is meaningful because many OpenType features default on.
  repeated OpenTypeFeatureSetting open_type_features = 19;
  // Figma TextStyle link identity. Presence requires engine semantics 43.
  // The referenced style resource may be resolved by a later capability.
  optional string text_style_id = 20;
  // Figma PaintStyle identity for this text range's fills. Presence requires
  // engine semantics 47 and is independent of the owning node's fill link.
  optional string paint_style_id = 21;
}

message OpenTypeFeatureSetting {
  string tag = 1;
  bool enabled = 2;
}

enum LeadingTrim {
  LEADING_TRIM_UNSPECIFIED = 0;
  LEADING_TRIM_NONE = 1;
  LEADING_TRIM_CAP_HEIGHT = 2;
}

enum TextDecoration {
  TEXT_DECORATION_UNSPECIFIED = 0;
  TEXT_DECORATION_UNDERLINE = 1;
  TEXT_DECORATION_STRIKETHROUGH = 2;
}

enum TextDecorationStyle {
  TEXT_DECORATION_STYLE_UNSPECIFIED = 0;
  TEXT_DECORATION_STYLE_SOLID = 1;
  TEXT_DECORATION_STYLE_WAVY = 2;
  TEXT_DECORATION_STYLE_DOTTED = 3;
}

message TextDecorationOffset {
  double value = 1;
  TextDecorationOffsetUnit unit = 2;
}

enum TextDecorationOffsetUnit {
  TEXT_DECORATION_OFFSET_UNIT_UNSPECIFIED = 0;
  TEXT_DECORATION_OFFSET_UNIT_PIXELS = 1;
  TEXT_DECORATION_OFFSET_UNIT_PERCENT = 2;
  TEXT_DECORATION_OFFSET_UNIT_AUTO = 3;
}

message TextDecorationThickness {
  double value = 1;
  TextDecorationThicknessUnit unit = 2;
}

// AUTO remains wire absence. An explicit value is restricted to the SolidPaint
// fields that are already admitted by Canonical paint semantics.
message TextDecorationColor {
  Color color = 1;
  bool visible = 2;
  float opacity = 3;
  BlendMode blend_mode = 4;
}

enum TextDecorationThicknessUnit {
  TEXT_DECORATION_THICKNESS_UNIT_UNSPECIFIED = 0;
  TEXT_DECORATION_THICKNESS_UNIT_PIXELS = 1;
  TEXT_DECORATION_THICKNESS_UNIT_PERCENT = 2;
  TEXT_DECORATION_THICKNESS_UNIT_AUTO = 3;
}

enum HyperlinkType {
  HYPERLINK_TYPE_UNSPECIFIED = 0;
  HYPERLINK_TYPE_URL = 1;
  HYPERLINK_TYPE_NODE = 2;
}

message HyperlinkTarget {
  HyperlinkType type = 1;
  string value = 2;
}

message ParagraphStyle {
  TextAlignment alignment = 1;
  optional double line_height = 2;
  double paragraph_spacing = 3;
  // Omission preserves the legacy pixel interpretation. Explicit PERCENT or
  // AUTO requires engine semantics 18; PIXELS is accepted on input and
  // canonicalized back to omission so old documents keep their hashes.
  optional LineHeightUnit line_height_unit = 4;
  // Presence-bearing first-line inset from the paragraph's left edge.
  // Omission preserves legacy layout and canonical hashes.
  optional double paragraph_indent = 5;
  // Omission preserves Figma AUTO and every legacy document hash. Explicit
  // BALANCE/PRETTY requires engine semantics 20.
  optional TextWrapStyle text_wrap_style = 6;
  // Omission preserves Figma NONE and every legacy document hash. Explicit
  // ORDERED/UNORDERED requires engine semantics 29.
  optional TextListType list_type = 7;
  // Omission is Figma's zero list spacing and preserves legacy hashes.
  // Positive values require engine semantics 30.
  optional double list_spacing = 8;
  // Omission/false keeps list markers inside the text box. True moves the
  // first marker column outside the text box and requires engine semantics 32.
  optional bool hanging_list = 9;
  // Omission/false preserves legacy wrapping. True permits one boundary
  // punctuation grapheme to hang outside each visual line and requires
  // engine semantics 38.
  optional bool hanging_punctuation = 10;
}

// Sparse per-paragraph overrides keyed by the UTF-8 byte offset at which an
// authored paragraph begins. The record is intentionally append-only so later
// paragraph-level Figma fields can share the same durable coordinate model.
message ParagraphStyleRun {
  uint32 start = 1;
  // Figma list nesting level. Presence, including explicit zero, requires
  // engine semantics 31.
  optional uint32 indentation = 2;
  // Absence inherits ParagraphStyle.list_type. Explicit NONE disables the
  // global list for this paragraph. Presence requires engine semantics 33.
  optional TextListType list_type = 3;
  // Absence inherits ParagraphStyle.list_spacing. Presence, including zero,
  // requires engine semantics 34 and applies after this authored list item.
  optional double list_spacing = 4;
  // Absence inherits ParagraphStyle.paragraph_spacing. Presence, including
  // zero, requires engine semantics 35 and applies after this paragraph.
  optional double paragraph_spacing = 5;
  // Absence inherits ParagraphStyle.paragraph_indent. Presence, including
  // zero, requires engine semantics 36 and applies to this paragraph's first line.
  optional double paragraph_indent = 6;
  // Per-paragraph line-height override. PIXELS uses line_height alone;
  // PERCENT uses both fields; AUTO uses line_height_unit alone. Either field
  // requires engine semantics 37. Both absent inherit ParagraphStyle.
  optional double line_height = 7;
  optional LineHeightUnit line_height_unit = 8;
  // Absence inherits ParagraphStyle.text_wrap_style. Explicit AUTO disables
  // an inherited BALANCE/PRETTY value for this paragraph. Presence requires
  // engine semantics 39.
  optional TextWrapStyle text_wrap_style = 9;
}

enum TextWrapStyle {
  TEXT_WRAP_STYLE_UNSPECIFIED = 0;
  TEXT_WRAP_STYLE_AUTO = 1;
  TEXT_WRAP_STYLE_BALANCE = 2;
  TEXT_WRAP_STYLE_PRETTY = 3;
}

enum TextListType {
  TEXT_LIST_TYPE_UNSPECIFIED = 0;
  TEXT_LIST_TYPE_NONE = 1;
  TEXT_LIST_TYPE_ORDERED = 2;
  TEXT_LIST_TYPE_UNORDERED = 3;
}

enum LineHeightUnit {
  LINE_HEIGHT_UNIT_UNSPECIFIED = 0;
  LINE_HEIGHT_UNIT_PIXELS = 1;
  LINE_HEIGHT_UNIT_PERCENT = 2;
  LINE_HEIGHT_UNIT_AUTO = 3;
}

message TextProperties {
  repeated TextStyleRun runs = 1;
  ParagraphStyle paragraph = 2;
  TextAutoSize auto_size = 3;
  repeated FontReference fallback_fonts = 4;
  optional TextTruncation text_truncation = 5;
  // Only valid with ENDING. Figma exposes null as absence and requires >= 1.
  optional uint32 max_lines = 6;
  // Persistent insertion style for empty text. start/end must both be zero;
  // keeping it separate from runs preserves the non-empty coverage invariant.
  optional TextStyleRun base_style = 7;
  repeated ParagraphStyleRun paragraph_style_runs = 8;
}

message TextStyleResource {
  string id = 1;
  string key = 2;
  string name = 3;
  string description = 4;
  bool remote = 5;
  TextStyleRun style = 6;
  ParagraphStyle paragraph = 7;
}

message PaintStyleResource {
  string id = 1;
  string key = 2;
  string name = 3;
  string description = 4;
  bool remote = 5;
  PaintStack paints = 6;
}

enum VariableResolvedType {
  VARIABLE_RESOLVED_TYPE_UNSPECIFIED = 0;
  VARIABLE_RESOLVED_TYPE_BOOLEAN = 1;
  VARIABLE_RESOLVED_TYPE_COLOR = 2;
  VARIABLE_RESOLVED_TYPE_FLOAT = 3;
  VARIABLE_RESOLVED_TYPE_STRING = 4;
}

message VariableMode {
  string mode_id = 1;
  string name = 2;
}

message VariableCollectionResource {
  string id = 1;
  string key = 2;
  string name = 3;
  bool remote = 4;
  bool hidden_from_publishing = 5;
  repeated VariableMode modes = 6;
  string default_mode_id = 7;
}

message VariableValue {
  oneof value {
    bool boolean_value = 1;
    Color color_value = 2;
    double float_value = 3;
    string string_value = 4;
    string alias_variable_id = 5;
  }
}

message VariableModeValue {
  string mode_id = 1;
  VariableValue value = 2;
}

message VariableResource {
  string id = 1;
  string key = 2;
  string name = 3;
  string description = 4;
  bool remote = 5;
  bool hidden_from_publishing = 6;
  string collection_id = 7;
  VariableResolvedType resolved_type = 8;
  repeated VariableModeValue values_by_mode = 9;
  repeated string scopes = 10;
  // Optional Figma code syntax names keyed by WEB, ANDROID, or iOS.
  // Presence requires engine semantics 49.
  map<string, string> code_syntax = 11;
}

// M3 prototype vocabulary. These records are append-only and intentionally
// separate from Player's transient navigation/overlay state. The current Core
// also keeps an opaque extension mirror so older engines can preserve a newer
// prototype value byte-for-byte rather than decoding/re-encoding unknown oneof
// tags.
message PrototypeEmpty {}
message PrototypeTimeout { double timeout_ms = 1; }
message PrototypeTrigger {
  oneof kind {
    PrototypeEmpty on_click = 1;
    PrototypeEmpty on_press = 2;
    PrototypeEmpty on_hover = 3;
    PrototypeTimeout after_timeout = 4;
  }
}
message PrototypeTransition {
  oneof kind {
    PrototypeEmpty none = 1;
    PrototypeTimedTransition dissolve = 2;
    PrototypeDirectionalTransition directional = 3;
  }
}
message PrototypeTimedTransition { double duration_ms = 1; string easing = 2; }
message PrototypeDirectionalTransition { double duration_ms = 1; string easing = 2; string direction = 3; }
message PrototypeNodeAction {
  string navigation = 1;
  optional bytes destination_id = 2;
  optional PrototypeTransition transition = 3;
  optional double overlay_relative_x = 4;
  optional double overlay_relative_y = 5;
}
message PrototypeUrlAction { string url = 1; }
message PrototypeAction {
  oneof kind {
    PrototypeNodeAction node = 1;
    PrototypeEmpty back = 2;
    PrototypeEmpty close = 3;
    PrototypeUrlAction url = 4;
  }
}
message PrototypeReaction { PrototypeTrigger trigger = 1; repeated PrototypeAction actions = 2; }
message PrototypeOverlayMetadata {
  string position_type = 1;
  optional double relative_x = 2;
  optional double relative_y = 3;
  string background_interaction = 4;
}
message PrototypeMetadata { bool starting_point = 1; optional PrototypeOverlayMetadata overlay = 2; }

message SceneNode {
  bytes node_id = 1;
  optional bytes parent_id = 2;
  bytes page_id = 3;
  PositionId position_id = 4;
  string name = 5;
  NodeKind kind = 6;
  double x = 7;
  double y = 8;
  double width = 9;
  double height = 10;
  double rotation = 11;
  Paint fill = 12;
  Paint stroke = 13;
  double stroke_width = 14;
  double opacity = 15;
  double corner_radius = 16;
  string text = 17;
  bool visible = 18;
  bool locked = 19;
  optional bytes asset_id = 20;
  optional TextProperties text_properties = 21;
  StrokeCap stroke_cap_start = 22;
  StrokeCap stroke_cap_end = 23;
  bool contents_hidden = 24;
  StrokeJoin stroke_join = 25;
  double stroke_miter_limit = 26;
  repeated double stroke_dash_pattern = 27;
  // Empty retains uniform `stroke_width`; exactly four values mean
  // top/right/bottom/left weights for Frame and Rectangle.
  repeated double stroke_weights = 28;
  StrokeAlign stroke_align = 29;
  optional ArcData arc_data = 30;
  optional Transform relative_transform = 31;
  // Omission preserves Figma's historical Frame default: clip descendants.
  optional bool clips_content = 32;
  // Empty retains `corner_radius`; four values are TL/TR/BR/BL.
  repeated double corner_radii = 33;
  // Frame/Rectangle/Section only. 0 retains circular corners; 1 is the
  // maximally continuous Figma-compatible corner treatment.
  double corner_smoothing = 34;
  // Empty keeps the legacy singular paint fields. Non-empty arrays are ordered
  // paint stacks, composited in array order.
  repeated Paint fills = 35;
  repeated Paint strokes = 36;
  optional Constraints constraints = 37;
  // Forward-compatibility payloads owned by newer engine versions. Unknown keys
  // are preserved byte-for-byte across load/save and operation replay so a
  // Phase 3+ node round-trips through an older client without being rewritten.
  map<string, bytes> extensions = 38;
  optional DropShadow drop_shadow = 39;
  optional PolygonParameters polygon_parameters = 40;
  optional StarParameters star_parameters = 41;
  optional VectorPath vector_path = 42;
  optional BooleanOperation boolean_operation = 43;
  repeated Effect effect_stack = 44;
  optional AutoLayout auto_layout = 45;
  BlendMode blend_mode = 46;
  repeated PrototypeReaction reactions = 47;
  optional PrototypeMetadata prototype_metadata = 48;
  optional PaintStack fill_stack = 49;
  optional PaintStack stroke_stack = 50;
  optional string fill_style_id = 51;
  optional string stroke_style_id = 52;
  optional string background_style_id = 53;
}

message GeometryUpdate {
  bytes node_id = 1;
  double x = 2;
  double y = 3;
  double width = 4;
  double height = 5;
  double rotation = 6;
  // Leaves constrained descendants unchanged for resizeWithoutConstraints.
  bool ignore_constraints = 7;
}

message AppearanceUpdate {
  bytes node_id = 1;
  Paint fill = 2;
  Paint stroke = 3;
  double stroke_width = 4;
  double opacity = 5;
  double corner_radius = 6;
  bool visible = 7;
  bool locked = 8;
  StrokeCap stroke_cap_start = 9;
  StrokeCap stroke_cap_end = 10;
  bool contents_hidden = 11;
  StrokeJoin stroke_join = 12;
  double stroke_miter_limit = 13;
  repeated double stroke_dash_pattern = 14;
  repeated double stroke_weights = 15;
  StrokeAlign stroke_align = 16;
  optional ArcData arc_data = 17;
  optional Transform relative_transform = 18;
  optional bool clips_content = 19;
  repeated double corner_radii = 20;
  double corner_smoothing = 21;
  repeated Paint fills = 22;
  repeated Paint strokes = 23;
  optional Constraints constraints = 24;
  optional DropShadow drop_shadow = 25;
  optional PolygonParameters polygon_parameters = 26;
  optional StarParameters star_parameters = 27;
  repeated Effect effect_stack = 28;
  optional AutoLayout auto_layout = 29;
  BlendMode blend_mode = 30;
  optional PaintStack fill_stack = 31;
  optional PaintStack stroke_stack = 32;
}

// Canonical Frame layout configuration. Kept separate from AppearanceUpdate so
// layout carries an explicit reducer command and can reflow descendants
// atomically rather than being an incidental visual field.
message AutoLayoutUpdate {
  bytes node_id = 1;
  AutoLayout auto_layout = 2;
}

message CreatePage {
  PageRef page = 1;
}

message CreateNode {
  SceneNode node = 1;
}

message RenameNode {
  bytes node_id = 1;
  string name = 2;
}

message SetText {
  bytes node_id = 1;
  string text = 2;
}

message SetTextProperties {
  bytes node_id = 1;
  TextProperties properties = 2;
}

message DeleteNode {
  bytes node_id = 1;
}

// Restores a specific tombstoned node as part of a resolved history replay.
// This is intentionally distinct from CreateNode: a deleted node ID cannot be
// allocated to an unrelated new node, but undo/redo must be able to restore it.
message RestoreNode {
  SceneNode node = 1;
}

// A resolved sibling-order key. It is intentionally separate from geometry so
// reorders are durable, atomic document operations rather than UI array edits.
message SetNodePosition {
  bytes node_id = 1;
  PositionId position_id = 2;
}

// Resolved structural move. Geometry is intentionally absent: this operation
// preserves the child's world-relative visual position while changing only its
// canonical parent and sibling order.
message SetNodeParent {
  bytes node_id = 1;
  optional bytes parent_id = 2;
  PositionId position_id = 3;
}

message SetDocumentColorProfile {
  DocumentColorProfile profile = 1;
}

// Registers metadata for an Asset that the Asset Service has already admitted
// and attached to this document. Raw bytes never cross the Document protocol.
message RegisterResource {
  ResourceIndexEntry resource = 1;
}

message RegisterTextStyle {
  TextStyleResource style = 1;
}

message RegisterPaintStyle {
  PaintStyleResource style = 1;
}

message RegisterVariableCollection {
  VariableCollectionResource collection = 1;
}

message RegisterVariable {
  VariableResource variable = 1;
}

message SetVariable {
  VariableResource variable = 1;
}

message DeleteVariable {
  string variable_id = 1;
}

message SetVariableCollection {
  VariableCollectionResource collection = 1;
  repeated VariableResource variables = 2;
}

message DeleteVariableCollection {
  string collection_id = 1;
}

message SetPaintStyleLinks {
  bytes node_id = 1;
  optional string fill_style_id = 2;
  optional string stroke_style_id = 3;
  optional string background_style_id = 4;
}

// Assigns or clears an image fill on a Frame, Rectangle, Ellipse, or Image
// node. The asset must already be a registered document resource.
message ImageFillUpdate {
  bytes node_id = 1;
  optional bytes asset_id = 2;
}

// Replaces a Vector node's canonical path atomically. Fine-grained point
// editing is intentionally represented by a complete resolved path so all
// replicas apply the same deterministic result.
message SetVectorPath {
  bytes node_id = 1;
  VectorPath vector_path = 2;
}

// Converts a vector-like shape into an immutable-base TextPath in place. The
// path is pre-resolved so every replica retains the same NodeId and geometry.
message ConvertToTextPath {
  bytes node_id = 1;
  VectorPath vector_path = 2;
}

// Moves one existing anchor in a VectorPath. Point identity stays stable so
// replicas do not need to infer which duplicate coordinate was edited.
message MoveVectorPoint {
  bytes node_id = 1;
  bytes point_id = 2;
  double x = 3;
  double y = 4;
}

// Opens or closes an existing subpath by stable canonical array index.
message SetVectorSubpathClosed {
  bytes node_id = 1;
  uint32 subpath_index = 2;
  bool closed = 3;
}

// Inserts a client-allocated stable point after a resolved predecessor. An
// absent predecessor means the beginning of the addressed subpath.
message InsertVectorPoint {
  bytes node_id = 1;
  uint32 subpath_index = 2;
  optional bytes after_point_id = 3;
  VectorPoint point = 4;
}

// Deletes one anchor. Core rejects the operation if it would violate the
// minimum-point invariant for the addressed open or closed subpath.
message DeleteVectorPoint {
  bytes node_id = 1;
  bytes point_id = 2;
}

// Replaces both relative handles and the tangent classification of one point.
// Each handle is absent only when both components are absent.
message SetVectorPointHandles {
  bytes node_id = 1;
  bytes point_id = 2;
  optional double handle_in_x = 3;
  optional double handle_in_y = 4;
  optional double handle_out_x = 5;
  optional double handle_out_y = 6;
  VectorPointType point_type = 7;
}

// Changes the reducer selector of a live BooleanOperation while retaining its
// ordered children and all editable source geometry.
message SetBooleanOperation {
  bytes node_id = 1;
  BooleanOperation operation = 2;
}

// Splits the directed segment after `after_point_id` at `t` in (0, 1). Core
// performs exact de Casteljau subdivision and allocates the supplied PointId.
message SplitVectorSegment {
  bytes node_id = 1;
  uint32 subpath_index = 2;
  bytes after_point_id = 3;
  double t = 4;
  bytes point_id = 5;
}

// Joins two endpoint anchors belonging to one VectorPath. Different open
// subpaths merge in the explicit first→second direction; opposite endpoints
// on one subpath close that subpath.
message ConnectVectorEndpoints {
  bytes node_id = 1;
  uint32 first_subpath_index = 2;
  bytes first_point_id = 3;
  uint32 second_subpath_index = 4;
  bytes second_point_id = 5;
}

// Phase 2's sole general-mask mode. A true flag marks this paintable sibling
// as the alpha source for following siblings until the next mask sibling.
message SetMask {
  bytes node_id = 1;
  bool enabled = 2;
}

// Replaces the complete canonical extension map. It is used by M3 so a
// reaction update and unknown imported extension values remain one atomic,
// replayable reducer command.
message SetNodeExtensions {
  bytes node_id = 1;
  map<string, bytes> extensions = 2;
}

message ResolvedOperation {
  oneof kind {
    CreatePage create_page = 1;
    CreateNode create_node = 2;
    GeometryUpdate update_geometry = 3;
    RenameNode rename_node = 4;
    AppearanceUpdate set_appearance = 5;
    SetText set_text = 6;
    SetDocumentColorProfile set_document_color_profile = 7;
    DeleteNode delete_node = 8;
    RegisterResource register_resource = 9;
    SetTextProperties set_text_properties = 10;
    ImageFillUpdate set_image_fill = 11;
    SetNodePosition set_node_position = 12;
    RestoreNode restore_node = 13;
    SetNodeParent set_node_parent = 14;
    SetVectorPath set_vector_path = 15;
    MoveVectorPoint move_vector_point = 16;
    SetVectorSubpathClosed set_vector_subpath_closed = 17;
    InsertVectorPoint insert_vector_point = 18;
    DeleteVectorPoint delete_vector_point = 19;
    SetVectorPointHandles set_vector_point_handles = 20;
    SetBooleanOperation set_boolean_operation = 21;
    SplitVectorSegment split_vector_segment = 22;
    SetMask set_mask = 23;
    AutoLayoutUpdate set_auto_layout = 24;
    ConnectVectorEndpoints connect_vector_endpoints = 25;
    SetNodeExtensions set_node_extensions = 26;
    ConvertToTextPath convert_to_text_path = 27;
    RegisterTextStyle register_text_style = 28;
    RegisterPaintStyle register_paint_style = 29;
    SetPaintStyleLinks set_paint_style_links = 30;
    RegisterVariableCollection register_variable_collection = 31;
    RegisterVariable register_variable = 32;
    SetVariable set_variable = 33;
    DeleteVariable delete_variable = 34;
    SetVariableCollection set_variable_collection = 35;
    DeleteVariableCollection delete_variable_collection = 36;
  }
}

message ResolvedOperationBatch {
  repeated ResolvedOperation operations = 1;
}

message OperationEnvelope {
  uint32 schema_version = 1;
  bytes document_id = 2;
  bytes operation_id = 3;
  bytes transaction_id = 4;
  bytes actor_id = 5;
  bytes session_id = 6;
  uint64 client_sequence = 7;
  uint64 base_revision = 8;
  repeated bytes causal_parent_ids = 9;
  bytes payload = 10; // encoded ResolvedOperationBatch
  bytes payload_hash = 11; // SHA-256 over canonical payload, not protobuf bytes
  optional uint32 engine_semantics_version = 12;
  reserved 13 to 15;
}

enum AckResult {
  ACK_RESULT_UNSPECIFIED = 0;
  ACK_RESULT_ACCEPTED = 1;
  ACK_RESULT_ACCEPTED_WITH_TRANSFORM = 2;
  ACK_RESULT_REJECTED_CONFLICT = 3;
  ACK_RESULT_REJECTED_PERMANENT = 4;
}

message OperationAck {
  uint32 schema_version = 1;
  bytes document_id = 2;
  bytes operation_id = 3;
  AckResult result = 4;
  optional uint64 accepted_revision = 5;
  optional bytes document_hash = 6;
  optional OperationEnvelope canonical_operation = 7;
  optional ProtocolError error = 8;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_PROTOCOL_VERSION_UNSUPPORTED = 1;
  ERROR_CODE_SCHEMA_VERSION_UNSUPPORTED = 2;
  ERROR_CODE_INVALID_ENVELOPE = 3;
  ERROR_CODE_HASH_MISMATCH = 4;
  ERROR_CODE_BASE_REVISION_CONFLICT = 5;
  ERROR_CODE_PERMISSION_DENIED = 6;
  ERROR_CODE_RESOURCE_LIMIT = 7;
  ERROR_CODE_INTERNAL = 8;
}

message ProtocolError {
  ErrorCode code = 1;
  string safe_message = 2;
  VersionRange supported_protocol_versions = 3;
  optional uint32 minimum_engine_semantics_version = 4;
  map<string, string> details = 5;
}

message VersionNegotiationRequest {
  uint32 protocol_version = 1;
  optional uint32 engine_semantics_version = 2;
  string client_version = 3;
}

message VersionNegotiationResponse {
  VersionRange supported_protocol_versions = 1;
  uint32 selected_protocol_version = 2;
  optional uint32 minimum_engine_semantics_version = 3;
  optional ProtocolError error = 4;
}
